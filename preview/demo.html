 function node(tag,cls,text,parent){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;if(parent)parent.appendChild(e);return e;}
 function button(cls,text,parent,fn){const e=node('button',cls+' cursor-interaction',text,parent);e.type='button';e.addEventListener('click',fn);return e;}
 function remember(){}
 function hydrate(value){
  const p=value&&value.privateContent;if(!p)return;
  for(const k of Object.keys(settings))if(p.settings&&typeof p.settings[k]===typeof settings[k])settings[k]=p.settings[k];
  for(const k of Object.keys(config))if(p.config&&typeof p.config[k]==='boolean')config[k]=p.config[k];
  if(['home','apps','sources','phone','settings','navigation','player','devices','vehicle','contacts','fuel','settings-category','radio','player-menu','library','track-list','stations','favorites','dialpad','call','messages','message','maintenance'].includes(p.route))state.route=p.route;
  if(Number.isInteger(p.focus))state.focus=Math.max(0,Math.min(20,p.focus));
  if(p.media){const m=p.media;if(['FM','AM','Bluetooth','USB 1 · демо','USB 2','AUX'].includes(m.source))state.source=m.source;for(const [k,min,max] of [['track',0,2],['repeat',0,2],['elapsed',0,338],['fm',875,1080],['am',531,1602]])if(Number.isInteger(m[k]))state[k]=Math.max(min,Math.min(max,m[k]));for(const k of ['playing','shuffle','radioMuted'])if(typeof m[k]==='boolean')state[k]=m[k];}
  if(p.appearance){if(p.appearance.selectedText>=30&&p.appearance.selectedText<=40)appearance.selectedText=p.appearance.selectedText;if(p.appearance.selectedIcon>=44&&p.appearance.selectedIcon<=72)appearance.selectedIcon=p.appearance.selectedIcon;}
  if(Number.isInteger(p.category))state.category=Math.max(0,Math.min(categories.length-1,p.category));
 }
 function go(route){state.stack.push({route:state.route,focus:state.focus,category:state.category});state.route=route;state.focus=route==='player'?1:0;state.adjust=null;state.choice=null;render();remember();}
 function back(){
  if(state.modal){state.modal=null;render();remember();return;}
  if(state.adjust||state.choice){if(state.choice)state.focus=state.choice.returnFocus;state.adjust=null;state.choice=null;render();remember();return;}
  const previous=state.stack.pop();if(previous)Object.assign(state,previous);else{state.route='home';state.focus=2;}
  render();remember();
 }
 function main(){state=initial();render();remember();}
 function dialog(title,text,actions){state.modal={title,text,focus:0,actions:actions||[{label:'Понятно',run(){state.modal=null;render();}}]};render();remember();}
 function toggle(label,key){return {label,value:()=>settings[key]?'✓':'',check:true,run(){settings[key]=!settings[key];render();remember();}};}
 function adjust(label,key,min,max){return {label,range:{key,min,max},value:()=>String(settings[key]),run(){state.adjust={label,key,min,max};render();remember();}};}
 function choose(label,key,options){return {label,value:()=>settings[key],run(){state.choice={label,key,options,returnFocus:state.focus};state.focus=Math.max(0,options.indexOf(settings[key]));render();remember();}};}

 function settingItems(){
  switch(state.category){
   case 0:return [{label:'Выключить дисплей',run(){dialog('Дисплей выключен','Нажми «Включить», чтобы вернуться.',[{label:'Включить',run(){state.modal=null;render();}}]);}},choose('Режим','displayMode',['Авто','День','Ночь']),adjust('Яркость','brightness',-5,5),adjust('Контрастность','contrast',-5,5),choose('Часы на главном экране','clockStyle',['Аналоговые','Цифровые']),{label:'Сброс настроек дисплея',run(){dialog('Сброс настроек','Вернуть исходные значения в этом макете?',[{label:'Отмена',run(){state.modal=null;render();}},{label:'Сбросить',run(){settings.brightness=0;settings.contrast=0;settings.displayMode='Авто';state.modal=null;render();remember();}}]);}}];

   case 2:{const a=[adjust('Низкие частоты','bass',-6,6),adjust('Высокие частоты','treble',-6,6),adjust('Баланс: вперёд / назад','fade',-9,9),adjust('Баланс: влево / вправо','balance',-9,9),adjust('Авторегулировка громкости','volume',0,7)];if(config.bose)a.push(toggle('Bose AudioPilot','autopilot'),toggle('Bose Centerpoint','centerpoint'));return a;}

 function getItems(){
  if(state.choice)return state.choice.options.map(option=>({label:option,check:true,value:()=>settings[state.choice.key]===option?'✓':'',run(){settings[state.choice.key]=option;state.focus=state.choice.returnFocus;state.choice=null;render();remember();}}));
  switch(state.route){
   case 'apps':{const a=[{label:'i-DM',run(){dialog('i-DM','Просмотр оценок вождения будет доступен на CMU.');}},{label:'Экономия топлива',run(){go('fuel');}},{label:'Выбор водителя',run(){dialog('Выбор водителя','Профиль 1 · пример выбранного профиля.');}},{label:'Монитор состояния автомобиля',run(){go('vehicle');}}];if(config.carplay)a.push({label:'Apple CarPlay',run(){projection('Apple CarPlay');}});if(config.android)a.push({label:'Android Auto',run(){projection('Android Auto');}});return a;}
